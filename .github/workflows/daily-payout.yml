# Pays the daily high-score prizes (see scripts/daily-payout.ts and DAILY_PRIZES in src/config.ts).
# Runs every day at 00:05 UTC, with a backup run at 01:41 UTC: GitHub can delay or even drop scheduled
# runs near the top of the hour, and the job never pays the same prize twice, so a second run is safe.
# The backup only posts to Discord if it actually paid something (i.e. the 00:05 run was missed).
# Run it by hand from the Actions tab: "Dry run" (the default) only
# prints who would be paid; untick it to pay now. It never pays the same prize twice.
# With the DISCORD_WINNERS_WEBHOOK secret set, each scheduled run also posts the results to #winners;
# tick "Post a test message" to check that connection.
name: Daily prize payout

on:
  schedule:
    - cron: '5 0 * * *'
    - cron: '41 1 * * *'     # backup (see above); keep in sync with BACKUP_RUN below
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: only show what would be paid'
        type: boolean
        default: true
      discord_test:
        description: 'Post a test message to the Discord #winners channel'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-payout
  cancel-in-progress: false

jobs:
  payout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pay the prizes that are due
        run: npx tsx scripts/daily-payout.ts
        env:
          PRIZE_WALLET_MNEMONIC: ${{ secrets.PRIZE_WALLET_MNEMONIC }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          DISCORD_WINNERS_WEBHOOK: ${{ secrets.DISCORD_WINNERS_WEBHOOK }}
          DISCORD_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.discord_test && '1' || '' }}
          BACKUP_RUN: ${{ github.event.schedule == '41 1 * * *' && '1' || '' }}
